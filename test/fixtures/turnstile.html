<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Turnstile Fixture</title>
</head>
<body>
    <!-- Stands in for a form with a Cloudflare Turnstile widget. As with the real
         one, the widget's iframe sits in a closed shadow root and writes its token
         into the hidden input once it passes. The test serves the iframe. -->
    <h1>Login</h1>
    <div><div id="host"></div><input type="hidden" name="cf-turnstile-response"></div>
    <script>
        const frame = document.createElement("iframe");
        frame.src = "https://challenges.cloudflare.com/fixture";
        frame.style.cssText = "width: 300px; height: 65px; border: 0";
        document.getElementById("host").attachShadow({ mode: "closed" }).appendChild(frame);
        addEventListener("message", (e) => {
            if (e.origin === "https://challenges.cloudflare.com") {
                document.querySelector('[name="cf-turnstile-response"]').value = e.data;
            }
        });
    </script>
</body>
</html>
