<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Turnstile Form Fixture</title>
</head>
<body>
    <!-- Stands in for a form that renders Turnstile from its own script and takes
         the token only from the widget's callback, as Angular/React form controls
         do. The test serves Turnstile's api.js. -->
    <h1>Login</h1>
    <div id="widget"></div>
    <p id="form-token"></p>
    <script>
        window.onTurnstileLoad = () => turnstile.render("#widget", {
            sitekey: "0x4AAAAAAAfixture",
            action: "login",
            callback: (token) => { document.getElementById("form-token").textContent = token; },
        });
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad" async></script>
</body>
</html>
